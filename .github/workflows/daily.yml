name: daily-post

on:
  schedule:
    - cron: "52 21 * * 0-4,6"   # 한국시간 월~금·일 오전 6:52 (UTC 전날 21:52)
    - cron: "23 0 * * 6"        # 한국시간 토요일 오전 9:23 '이번 주 총정리' (UTC 00:23)
  workflow_dispatch:         # Actions 탭에서 수동 실행 버튼

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 한글 폰트 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - run: pip install -r requirements.txt

      - name: 뉴스 수집 + 원고 + 카드 생성
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py build

      - name: 카드 이미지 업로드 (공개 주소 만들기)
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add output data
          git commit -m "cards $(TZ=Asia/Seoul date +%F)" || echo "변경 없음"
          git push

      - name: 인스타그램 게시
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python main.py publish

      - name: 스레드 게시
        continue-on-error: true   # 스레드가 실패해도 인스타 게시 기록은 저장
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python main.py threads

      # 릴스는 점심 시간에 reel.yml에서 따로 올림

      - name: 게시 기록 저장
        run: |
          git add output
          git commit -m "published $(TZ=Asia/Seoul date +%F)" || echo "변경 없음"
          git push
